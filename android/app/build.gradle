plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

// kotlin-stdlib comes from AGP 9 built in Kotlin; no version pinned here
static def parsePropertiesFile(f) {
    def map = [:]
    if (!f.exists()) return map
    f.eachLine { line ->
        line = line.trim()
        if (line && !line.startsWith("#") && line.contains("=")) {
            def eq = line.indexOf("=")
            def key = line.substring(0, eq).trim()
            def value = line.substring(eq + 1).trim()
            map[key] = value
        }
    }
    return map
}

def localProperties = parsePropertiesFile(rootProject.file("local.properties"))
def flutterVersionCode = localProperties["flutter.versionCode"] ?: "1"
def flutterVersionName = localProperties["flutter.versionName"] ?: "1.0"

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = parsePropertiesFile(keystorePropertiesFile)
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
    keystoreProperties['storeFile'] &&
    keystoreProperties['keyAlias'] &&
    keystoreProperties['storePassword'] &&
    keystoreProperties['keyPassword']

android {

    // compileSdk and targetSdk are written out, not taken from flutter.*:
    // Flutter 3.47.2 still defaults both to 36 (FlutterExtension.kt:23,34) and
    // referencing it would move this app back a level.
    compileSdkVersion 37
    ndkVersion flutter.ndkVersion   // 28.2.13676358 in Flutter 3.47.2
    namespace "com.nakajimamasao.studyphonics"

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.nakajimamasao.studyphonics"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core:1.19.0"
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
